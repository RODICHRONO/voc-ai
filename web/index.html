<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>voc-ai</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --surface: #ffffff;
        --text: #1b1f24;
        --muted: #5b6573;
        --border: #d8dde4;
        --accent: #2457d6;
        --speech: #1a7f4b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171c;
          --surface: #1c2027;
          --text: #e8ebf0;
          --muted: #9aa4b2;
          --border: #2e3541;
          --accent: #6b9bff;
          --speech: #46c481;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
      h1 { margin: 0; font-size: 1.4rem; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      #status { font-weight: 600; color: var(--muted); }
      #status[data-state="speech"] { color: var(--speech); }
      meter { width: 100%; height: 14px; }
      #log { margin: 0; padding-left: 18px; display: grid; gap: 10px; }
      .turn-text { color: var(--text); }
      .turn-meta { color: var(--muted); font-size: 0.85rem; }
      .turn-rejected { color: var(--muted); font-size: 0.85rem; font-style: italic; }
      #error { color: #c0362c; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>voc-ai : détection de parole</h1>

      <section class="card" aria-label="Contrôle du micro">
        <button id="toggle" type="button">Démarrer le micro</button>
        <p id="status" data-state="idle" role="status">Micro arrêté</p>
        <label>
          Probabilité de parole (Silero)
          <meter id="probability" min="0" max="1" value="0"></meter>
        </label>
        <p id="error" role="alert" hidden></p>
      </section>

      <section class="card" aria-labelledby="log-title">
        <strong id="log-title">Tours de parole détectés</strong>
        <ol id="log"></ol>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
